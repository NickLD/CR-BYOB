name: Device report
description: Tried CR-BYOB with a scanner or phone? Tell us whether it works, so the supported-devices list can grow.
title: "[Device] <scanner> on <phone>"
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Reports for **untested** scanners and phones are the most useful, and "it doesn't work" reports count just as much as "it works".
  - type: dropdown
    id: scanner
    attributes:
      label: Scanner
      options:
        - CR-Scan Otter
        - CR-Scan Otter Lite
        - CR-Scan Otter Lite Basic
        - CR-Scan Raptor
        - CR-Scan Raptor X
        - CR-Scan Raptor Pro
        - CR-Scan Raptor Pro Max
        - CR-Scan Ferret
        - CR-Scan Ferret Pro
        - Sermoon X1
        - Sermoon S1
        - Sermoon P1
        - Sermoon P1 Lite
        - Creality Pika
        - M1 Ultra
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: scanner_fw
    attributes:
      label: Scanner firmware
      description: Shown on the dashboard next to the scanner name, e.g. "fw 1.2.2".
  - type: input
    id: app_info
    attributes:
      label: App, phone and Android version
      description: Filled in when you open this form from the app (Send a device report). Otherwise long-press the version at the bottom of the CR-BYOB dashboard and paste the copied line here.
      placeholder: "CR-BYOB 0.1.0 (10099, github, abc1234) · Google Pixel 10 Pro XL · Android 16 (API 36)"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Wi-Fi Direct
        - Wi-Fi
        - Ethernet
        - This phone only (CrealityScan mobile app)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Creality Scan version
      description: The PC or phone app you scanned with, and its version.
      placeholder: "Creality Scan 4.x (Windows) / CrealityScan 3.1.2 (Android)"
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (preview and a full scan)
        - Partly works (say what doesn't)
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you did, what worked, what didn't, frame rates you saw, anything odd.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Optional but very helpful for scanners that don't work. Sent from the app with *Include the log* on, this box already holds the log: the recent log from the GitHub app, or a digest from a browser, where the whole log is also saved to Downloads as `crbyob-log-….zip`: attach that file here (drag it in, or use the attach button under the box). *Export log* under *Events* on the dashboard makes the same file at any time. Serial numbers, Wi-Fi names, passwords, MAC and IP addresses are removed from both.
      render: text
