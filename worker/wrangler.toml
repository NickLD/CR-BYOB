name = "crbyob-reports"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
GH_REPO = "NickLD/CR-BYOB"
GH_BOT_LOGIN = "crbyob-reports[bot]"

# shortcut: minute-level limit only, move to a Durable Object or KV counter if spam gets through
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 2, period = 60 }
