org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Java-only app: don't add the Kotlin stdlib that AGP's built-in Kotlin would otherwise put in the APK.
kotlin.stdlib.default.dependency=false

# GitHub repo the github flavor checks for new releases (owner/name).
crbyob.githubRepo=NickLD/CR-BYOB

# Anonymous device reports go through this Worker (private repo NickLD/crbyob-report-worker). Empty = feature hidden.
crbyob.reportWorker=https://crbyob-reports.nickld.workers.dev

# Donation page linked from the dashboard footer in the github flavor only (Play's payments policy
# restricts links to outside donation pages, so the play flavor has none).
crbyob.donateUrl=https://ko-fi.com/nickld
